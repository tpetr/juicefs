apiVersion: v1
kind: Pod
metadata:
  name: workflow-juicefs-contention-owner
  namespace: ai-workflows
  annotations:
    workspaces.semgrep.dev/deployment-id: poc-deployment
    workspaces.semgrep.dev/workflow-name: contention
    workspaces.semgrep.dev/workflow-uid: contention-1
spec:
  runtimeClassName: gvisor-netraw
  serviceAccountName: ai-workflows
  restartPolicy: Never
  containers:
  - name: step
    image: 338683922796.dkr.ecr.us-west-2.amazonaws.com/semgrep/fuse-fd-csi-driver@sha256:f4efcfec770ca4f2756111212f891d3ff24a368fc51800cb5cbb6c1c6f847d1a
    command: [/bin/sh, -ceu]
    args: ["printf 'owner-mounted\\n' > /workspace/owner; sleep 300"]
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      readOnlyRootFilesystem: true
    volumeMounts:
    - {name: workspace, mountPath: /workspace}
    - {name: control, mountPath: /control}
  volumes:
  - name: control
    emptyDir: {}
  - name: workspace
    csi:
      driver: workflow-juicefs.csi.semgrep.dev
      volumeAttributes:
        deploymentID: poc-deployment
        workflowName: contention
        workflowUID: contention-1
        controlEmptyDirName: control
---
apiVersion: v1
kind: Pod
metadata:
  name: workflow-juicefs-contention-challenger
  namespace: ai-workflows
  annotations:
    workspaces.semgrep.dev/deployment-id: poc-deployment
    workspaces.semgrep.dev/workflow-name: contention
    workspaces.semgrep.dev/workflow-uid: contention-1
spec:
  runtimeClassName: gvisor-netraw
  serviceAccountName: ai-workflows
  restartPolicy: Never
  containers:
  - name: step
    image: 338683922796.dkr.ecr.us-west-2.amazonaws.com/semgrep/fuse-fd-csi-driver@sha256:f4efcfec770ca4f2756111212f891d3ff24a368fc51800cb5cbb6c1c6f847d1a
    command: [/bin/sh, -ceu]
    args: ["printf 'challenger mounted only after lease release\\n'; sleep 300"]
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      readOnlyRootFilesystem: true
    volumeMounts:
    - {name: workspace, mountPath: /workspace}
    - {name: control, mountPath: /control}
  volumes:
  - name: control
    emptyDir: {}
  - name: workspace
    csi:
      driver: workflow-juicefs.csi.semgrep.dev
      volumeAttributes:
        deploymentID: poc-deployment
        workflowName: contention
        workflowUID: contention-1
        controlEmptyDirName: control
