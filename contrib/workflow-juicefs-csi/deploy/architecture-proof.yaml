apiVersion: v1
kind: Pod
metadata:
  name: workflow-juicefs-architecture-proof
  namespace: ai-workflows
spec:
  runtimeClassName: gvisor-netraw
  serviceAccountName: ai-workflows
  restartPolicy: Never
  securityContext:
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: proof
    image: 338683922796.dkr.ecr.us-west-2.amazonaws.com/semgrep/fuse-fd-csi-driver@sha256:dff06e298df387fa2b9e54642a07db7ac63c6d437c8c9d33c2797070186a3f19
    imagePullPolicy: IfNotPresent
    command: [/bin/sh, -ceu]
    args:
    - |
      timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      printf '%s %s\n' "$timestamp" "$HOSTNAME" > /workspace/original
      test "$(cat /workspace/original)" = "$timestamp $HOSTNAME"
      printf 'append\n' >> /workspace/original
      mv /workspace/original /workspace/renamed
      ls -la /workspace
      test "$(tail -n 1 /workspace/renamed)" = append
      rm /workspace/renamed
      test ! -e /workspace/renamed
      printf 'gvisor architecture proof passed at %s on %s\n' "$timestamp" "$HOSTNAME"
      sleep 600
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      readOnlyRootFilesystem: true
    volumeMounts:
    - {name: workspace, mountPath: /workspace}
  volumes:
  - name: workspace
    csi:
      driver: workflow-juicefs.csi.semgrep.dev
      readOnly: false
