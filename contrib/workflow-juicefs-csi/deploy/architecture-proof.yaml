apiVersion: v1
kind: Pod
metadata:
  name: workflow-juicefs-architecture-proof
  namespace: ai-workflows
  annotations:
    workspaces.semgrep.dev/deployment-id: poc-deployment
    workspaces.semgrep.dev/workflow-name: architecture-proof
    workspaces.semgrep.dev/workflow-uid: architecture-proof-1
spec:
  runtimeClassName: gvisor-netraw
  serviceAccountName: ai-workflows
  restartPolicy: Never
  securityContext:
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: proof
    image: 338683922796.dkr.ecr.us-west-2.amazonaws.com/semgrep/fuse-fd-csi-driver@sha256:f4efcfec770ca4f2756111212f891d3ff24a368fc51800cb5cbb6c1c6f847d1a
    imagePullPolicy: IfNotPresent
    command: [/bin/sh, -ceu]
    args:
    - |
      timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      printf '%s %s\n' "$timestamp" "$HOSTNAME" > /workspace/original
      test "$(cat /workspace/original)" = "$timestamp $HOSTNAME"
      printf 'append\n' >> /workspace/original
      mv /workspace/original /workspace/renamed
      ls -la /workspace
      test "$(tail -n 1 /workspace/renamed)" = append
      rm /workspace/renamed
      test ! -e /workspace/renamed
      workspace-csi-control mark-success /control/workspace.sock
      printf 'gvisor architecture proof passed at %s on %s\n' "$timestamp" "$HOSTNAME"
      sleep 600
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      readOnlyRootFilesystem: true
    volumeMounts:
    - {name: workspace, mountPath: /workspace}
    - {name: control, mountPath: /control}
  volumes:
  - name: control
    emptyDir: {}
  - name: workspace
    csi:
      driver: workflow-juicefs.csi.semgrep.dev
      readOnly: false
      volumeAttributes:
        deploymentID: poc-deployment
        workflowName: architecture-proof
        workflowUID: architecture-proof-1
        controlEmptyDirName: control
